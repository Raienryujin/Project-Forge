name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: "Nx Build & Strict Type Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive appropriate SHAs for Nx
        uses: nrwl/nx-set-shas@v4

      - name: Run Nx Affected (Lint, Test, Build)
        run: npx nx affected -t lint test build

      - name: Strict Type Gate (Day Zero OpenAPI)
        run: |
          # 1. Build the API to ensure api.json is generated
          cd apps/api
          dotnet build --configuration Release
          
          # 2. Generate frontend hooks
          cd ../web
          pnpm run generate-api
          
          # 3. Check for uncommitted generated changes
          cd ../../
          if [[ -n $(git status --porcelain -- apps/web/src/api) ]]; then
            echo "::error::Strict Type Gate Failed: The frontend types do not map perfectly to the backend."
            echo "::error::Please run 'pnpm run generate-api' in apps/web and commit the generated types."
            git status --porcelain -- apps/web/src/api
            git diff -- apps/web/src/api
            exit 1
          fi
          echo "✅ Strict Type Gate Passed: Frontend types perfectly match the C# API."
