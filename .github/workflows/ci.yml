# ============================================================================
# Project Forge — Path-Filtered CI Pipeline
# ============================================================================
# Strategy: Each job triggers ONLY when its relevant source paths change.
# This keeps CI fast and cost-efficient in a monorepo.
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── Backend: ASP.NET Core 8 ───────────────────────────────────────────────
  build-api:
    name: "🔧 Build API (.NET 8)"
    runs-on: ubuntu-latest

    # Only run when backend source or workflow definitions change
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'apps/api') ||
      contains(github.event.head_commit.modified, '.github/workflows')

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        continue-on-error: false

  # ── Frontend: Next.js / React ─────────────────────────────────────────────
  build-web:
    name: "🌐 Build Web (Next.js)"
    runs-on: ubuntu-latest

    # Only run when frontend source or workflow definitions change
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'apps/web') ||
      contains(github.event.head_commit.modified, 'packages') ||
      contains(github.event.head_commit.modified, '.github/workflows')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm turbo run build --filter=web

  # ── Gate: CI Status Check ─────────────────────────────────────────────────
  ci-gate:
    name: "✅ CI Gate"
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          echo "API:  ${{ needs.build-api.result }}"
          echo "Web:  ${{ needs.build-web.result }}"

          if [[ "${{ needs.build-api.result }}" == "failure" || \
                "${{ needs.build-web.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

          echo "All gates passed."
